<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FGEI Multi-Format Exam Generator</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <!-- MathLive CSS & JS -->
    <link rel="stylesheet" href="https://unpkg.com/mathlive/dist/mathlive-static.css" />
    <script src="https://unpkg.com/mathlive"></script>

    <style>
        body { background-color: #f8f9fa; padding-bottom: 60px; }
        .header-brand-logo { height: 48px; width: auto; margin-right: 12px; }
        .card { margin-bottom: 20px; box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
        .or-box { background-color: #f1f3f5; border-left: 3px solid #0d6efd; padding: 10px; margin-top: 8px; border-radius: 4px; }
        
        .equation-input-container {
            border: 1px solid #ced4da;
            border-radius: 0.375rem;
            background-color: #fff;
            padding: 8px;
        }
        math-field {
            font-size: 1.1rem;
            border: 1px solid #0d6efd;
            border-radius: 4px;
            padding: 4px 8px;
            width: 100%;
            background-color: #fafafa;
        }
        .urdu-text {
            direction: rtl;
            font-family: 'Jameel Noori Nastaliq', 'Urdu Typesetting', Tahoma, sans-serif;
            text-align: right;
        }
    </style>
</head>
<body>

<div class="container mt-4">
    <!-- Restored Header with Logo -->
    <div class="d-flex justify-content-between align-items-center mb-4 pb-2 border-bottom">
        <div class="d-flex align-items-center">
            <img src="/static/logo.png" alt="FGEI Logo" class="header-brand-logo" onerror="this.style.display='none'">
            <div>
                <h2 class="mb-0 fw-bold text-primary">FGEI Exam Generator</h2>
                <small class="text-muted">Editable Native Word Math & Federal Board OMR Pattern</small>
            </div>
        </div>
        <span class="badge bg-success fs-6">Logo & OMML Math Enabled</span>
    </div>

    <form id="examForm">
        <!-- Paper Metadata -->
        <div class="card">
            <div class="card-header bg-primary text-white fw-bold">Paper Information</div>
            <div class="card-body">
                <div class="row g-3">
                    <div class="col-md-6">
                        <label class="form-label">School Name</label>
                        <input type="text" id="school_name" class="form-control" value="FG Public School" required>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">Exam Title</label>
                        <input type="text" id="exam_title" class="form-control" value="Send-Up Examination 2026" required>
                    </div>
                    <div class="col-md-3">
                        <label class="form-label">Subject</label>
                        <input type="text" id="subject" class="form-control" value="Mathematics" required>
                    </div>
                    <div class="col-md-3">
                        <label class="form-label">Grade / Class</label>
                        <input type="text" id="grade" class="form-control" value="Class 10" required>
                    </div>
                    <div class="col-md-3">
                        <label class="form-label">Time Allowed</label>
                        <input type="text" id="time_allowed" class="form-control" value="2 Hours 30 Mins" required>
                    </div>
                    <div class="col-md-3">
                        <label class="form-label">Total Marks</label>
                        <input type="number" id="total_marks" class="form-control" value="75" required>
                    </div>
                    <div class="col-md-6">
                        <div class="form-check mt-2">
                            <input class="form-check-input" type="checkbox" id="is_board_pattern" checked>
                            <label class="form-check-label fw-bold text-primary" for="is_board_pattern">
                                Enable Board Pattern (Roll No & OMR Header)
                            </label>
                        </div>
                    </div>
                    <div class="col-md-6">
                        <div class="form-check mt-2">
                            <input class="form-check-input" type="checkbox" id="is_urdu_paper" onchange="toggleUrduPaperMode(this.checked)">
                            <label class="form-check-label fw-bold text-danger" for="is_urdu_paper">
                                Urdu Medium Paper (RTL & Nastaliq Font Support)
                            </label>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Section A: MCQs -->
        <div class="card">
            <div class="card-header bg-secondary text-white d-flex justify-content-between align-items-center fw-bold">
                <span>Section A: Multiple Choice Questions (MCQs)</span>
                <button type="button" class="btn btn-sm btn-light" onclick="addMCQ()">+ Add MCQ</button>
            </div>
            <div class="card-body" id="mcqContainer"></div>
        </div>

        <!-- Section B: Short Questions -->
        <div class="card">
            <div class="card-header bg-secondary text-white d-flex justify-content-between align-items-center fw-bold">
                <span>Section B: Short Questions</span>
                <button type="button" class="btn btn-sm btn-light" onclick="addShortQuestion()">+ Add Short Question</button>
            </div>
            <div class="card-body" id="shortQContainer"></div>
        </div>

        <!-- Section C: Long Questions -->
        <div class="card">
            <div class="card-header bg-secondary text-white d-flex justify-content-between align-items-center fw-bold">
                <span>Section C: Detailed / Long Questions</span>
                <button type="button" class="btn btn-sm btn-light" onclick="addLongQuestion()">+ Add Long Question</button>
            </div>
            <div class="card-body" id="longQContainer"></div>
        </div>

        <!-- Section D: Project / Practical Section -->
        <div class="card">
            <div class="card-header bg-secondary text-white d-flex justify-content-between align-items-center fw-bold">
                <span>Section D: Project / Practical Section</span>
                <button type="button" class="btn btn-sm btn-light" onclick="addProjectQuestion()">+ Add Practical/Project Question</button>
            </div>
            <div class="card-body" id="projectQContainer"></div>
        </div>

        <div class="text-center mt-4">
            <button type="submit" class="btn btn-success btn-lg px-5">Generate & Download .docx Paper</button>
        </div>
    </form>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
    let isUrduGlobal = false;

    function toggleUrduPaperMode(isUrdu) {
        isUrduGlobal = isUrdu;
        document.querySelectorAll('.input-text-field').forEach(el => {
            if (isUrdu) {
                el.classList.add('urdu-text');
            } else {
                el.classList.remove('urdu-text');
            }
        });
    }

    function buildMathEditorField(id, placeholderText, allowImage=false) {
        const urduClass = isUrduGlobal ? 'urdu-text' : '';
        return `
            <div class="equation-input-container mb-2">
                <input type="text" id="${id}_text" class="form-control mb-2 input-text-field ${urduClass}" placeholder="${placeholderText}">
                <label class="form-label text-primary small fw-bold">Math Formula Editor (Generates Native MS Word Equation):</label>
                <math-field id="${id}_mf"></math-field>
                <label class="form-label text-success small fw-bold">
                ${allowImage ? `

                <label class="form-label text-success small fw-bold">
                Add Diagram (Optional)
                </label>

                <input 
                type="file"
                accept="image/*"
                class="form-control diagram-upload"
                id="${id}_image">

                ` : ''}
            </div>
        `;
    }

    function extractValue(id) {
        const textVal = document.getElementById(`${id}_text`)?.value || "";
        const mf = document.getElementById(`${id}_mf`);
        const mathLatex = mf ? mf.getValue('latex-expanded').trim() : "";

        if (textVal && mathLatex) {
            return `${textVal} [MATH]${mathLatex}[/MATH]`;
        }
        if (mathLatex) {
            return `[MATH]${mathLatex}[/MATH]`;
        }
        return textVal;
    }

    let mcqCount = 0;
    function addMCQ() {
        mcqCount++;
        const id = `mcq_${mcqCount}`;
        const html = `
            <div class="border p-3 mb-3 bg-white rounded position-relative" id="${id}">
                <button type="button" class="btn-close position-absolute top-0 end-0 m-2" onclick="document.getElementById('${id}').remove()"></button>
                <h6>MCQ #${mcqCount}</h6>
                <div class="mb-2">
                    ${buildMathEditorField(`${id}_q`, 'Question text / سوال', true)}
                </div>
                <div class="row g-2">
                    <div class="col-md-3">${buildMathEditorField(`${id}_opt0`, 'Option A')}</div>
                    <div class="col-md-3">${buildMathEditorField(`${id}_opt1`, 'Option B')}</div>
                    <div class="col-md-3">${buildMathEditorField(`${id}_opt2`, 'Option C')}</div>
                    <div class="col-md-3">${buildMathEditorField(`${id}_opt3`, 'Option D')}</div>
                </div>
            </div>
        `;
        document.getElementById('mcqContainer').insertAdjacentHTML('beforeend', html);
    }

    let sqCount = 0;
    function addShortQuestion() {
        sqCount++;
        const id = `sq_${sqCount}`;
        const html = `
            <div class="border p-3 mb-3 bg-white rounded position-relative" id="${id}">
                <button type="button" class="btn-close position-absolute top-0 end-0 m-2" onclick="document.getElementById('${id}').remove()"></button>
                <div class="row">
                    <div class="col-md-10">
                        ${buildMathEditorField(`${id}_main`, 'Short question text / مختصر سوال', true)}
                    </div>
                    <div class="col-md-2">
                        <label class="form-label fw-semibold">Marks</label>
                        <input type="number" class="form-control sq-marks" value="3">
                    </div>
                </div>
                <div class="or-box">
                    <label class="form-label text-primary fw-bold">OR Choice Question (Optional / یا متبادل سوال)</label>
                    ${buildMathEditorField(`${id}_or`, 'Alternative question text')}
                </div>
            </div>
        `;
        document.getElementById('shortQContainer').insertAdjacentHTML('beforeend', html);
    }

    let lqCount = 0;
    function addLongQuestion() {
        lqCount++;
        const id = `lq_${lqCount}`;
        const html = `
            <div class="border p-3 mb-3 bg-white rounded position-relative" id="${id}">
                <button type="button" class="btn-close position-absolute top-0 end-0 m-2" onclick="document.getElementById('${id}').remove()"></button>
                <div class="row">
                    <div class="col-md-10">
                        ${buildMathEditorField(`${id}_main`, 'Long question text / تفصیلی سوال', true)}
                    </div>
                    <div class="col-md-2">
                        <label class="form-label fw-semibold">Marks</label>
                        <input type="number" class="form-control lq-marks" value="6">
                    </div>
                </div>
                <div class="or-box">
                    <label class="form-label text-primary fw-bold">OR Choice Question (Optional / یا متبادل سوال)</label>
                    ${buildMathEditorField(`${id}_or`, 'Alternative long question text')}
                </div>
            </div>
        `;
        document.getElementById('longQContainer').insertAdjacentHTML('beforeend', html);
    }

    let pqCount = 0;
    function addProjectQuestion() {
        pqCount++;
        const id = `pq_${pqCount}`;
        const html = `
            <div class="border p-3 mb-3 bg-white rounded position-relative" id="${id}">
                <button type="button" class="btn-close position-absolute top-0 end-0 m-2" onclick="document.getElementById('${id}').remove()"></button>
                <div class="row">
                    <div class="col-md-10">
                        ${buildMathEditorField(`${id}_main`, 'Project / Practical task / عملی کام یا پروجیکٹ', true)}
                    </div>
                    <div class="col-md-2">
                        <label class="form-label fw-semibold">Marks</label>
                        <input type="number" class="form-control pq-marks" value="10">
                    </div>
                </div>
            </div>
        `;
        document.getElementById('projectQContainer').insertAdjacentHTML('beforeend', html);
    }

    addMCQ();
    addShortQuestion();
    addLongQuestion();
    addProjectQuestion();

    async function uploadDiagram(input){

    if(!input.files[0]){
        return null;
    }


    let formData = new FormData();

    formData.append(
        "file",
        input.files[0]
    );


    let response = await fetch(
        "/upload-image",
        {
            method:"POST",
            body:formData
        }
    );


    let result = await response.json();


    return result.image;
}

    document.getElementById('examForm').addEventListener('submit', async (e) => {
        e.preventDefault();

        const mcqs = [];
        for (const el of document.querySelectorAll('#mcqContainer > div')) {
            const id = el.id;
            const text = extractValue(`${id}_q`);
            const opts = [
                extractValue(`${id}_opt0`),
                extractValue(`${id}_opt1`),
                extractValue(`${id}_opt2`),
                extractValue(`${id}_opt3`)
            ];
            if (text.trim()) {
                let image = await uploadDiagram(
                    document.getElementById(`${id}_q_image`)                               
);

                mcqs.push({ text: text, is_urdu: isUrduGlobal, options: opts, image:image });
            }
        };

        const short_questions = [];
        for (const el of document.querySelectorAll('#shortQContainer > div')) {
            const id = el.id;
            const main = extractValue(`${id}_main`);
            const or = extractValue(`${id}_or`);
            const marks = parseInt(el.querySelector('.sq-marks').value) || 3;
            if (main.trim()) {
                let image = await uploadDiagram(document.getElementById(`${id}_main_image`));
                short_questions.push({ main_question: main, or_question: or || null, is_urdu: isUrduGlobal, marks: marks, image: image});
            }
        };

        const long_questions = [];
        for (const el of document.querySelectorAll('#longQContainer > div')) {
            const id = el.id;
            const main = extractValue(`${id}_main`);
            const or = extractValue(`${id}_or`);
            const marks = parseInt(el.querySelector('.lq-marks').value) || 6;
            if (main.trim()) {
                let image = await uploadDiagram(document.getElementById(`${id}_main_image`)
);
                long_questions.push({ main_question: main, or_question: or || null, is_urdu: isUrduGlobal, marks: marks, image: image });
            }
        };

        const project_questions = [];
        for (const el of document.querySelectorAll('#projectQContainer > div')) {
            const id = el.id;
            const main = extractValue(`${id}_main`);
            const marks = parseInt(el.querySelector('.pq-marks').value) || 10;
            if (main.trim()) {
                project_questions.push({ main_question: main, is_urdu: isUrduGlobal, marks: marks });
            }
        };

        const payload = {
            school_name: document.getElementById('school_name').value,
            exam_title: document.getElementById('exam_title').value,
            subject: document.getElementById('subject').value,
            grade: document.getElementById('grade').value,
            time_allowed: document.getElementById('time_allowed').value,
            total_marks: parseInt(document.getElementById('total_marks').value),
            is_board_pattern: document.getElementById('is_board_pattern').checked,
            is_urdu_paper: document.getElementById('is_urdu_paper').checked,
            mcqs: mcqs,
            short_questions: short_questions,
            long_questions: long_questions,
            project_questions: project_questions
        };

        try {
            const res = await fetch('/generate-paper', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            });

            if (!res.ok) throw new Error('Failed to generate paper');

            const blob = await res.blob();
            const url = window.URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `${payload.subject}_${payload.grade}_Exam.docx`;
            document.body.appendChild(a);
            a.click();
            a.remove();
        } catch (err) {
            alert('Error generating document: ' + err.message);
        }
    });
</script>
</body>
</html>
